<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YKS Çalışma Panosu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style type="text/tailwindcss">
    @theme {
      --font-display: 'Syne', sans-serif;
      --font-sans: 'DM Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --color-void: #020208;
      --color-deep: #080810;
      --color-surface: #12121e;
      --color-surface-alt: #171726;
      --color-surface-hover: #1c1c2e;
      --color-border: rgba(255,255,255,0.055);
      --color-border-bright: rgba(255,255,255,0.12);
      --color-text-primary: #eeeef8;
      --color-text-secondary: #8080a0;
      --color-text-muted: #48486a;
      --color-accent: #00c9a7;
      --color-accent-dim: rgba(0,201,167,0.1);
      --color-teal: #d4a020;
      --color-amber: #f59e0b;
      --color-emerald: #10b981;
      --color-rose: #f43f5e;
      --color-red: #ef4444;
      --color-yellow: #eab308;
      --color-green: #22c55e;
    }
  </style>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:'DM Sans',sans-serif;background:#020208;color:#eeeef8;overflow-x:hidden;min-height:100vh}

    /* BG */
    .bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
    .orb{position:absolute;border-radius:50%;filter:blur(60px);will-change:transform}
    .orb-1{width:900px;height:900px;background:radial-gradient(circle,rgba(0,201,167,.1) 0%,transparent 70%);top:-200px;left:-200px;animation:drift1 28s ease-in-out infinite}
    .orb-2{width:700px;height:700px;background:radial-gradient(circle,rgba(212,160,32,.07) 0%,transparent 70%);bottom:-150px;right:-150px;animation:drift2 22s ease-in-out infinite}
    .orb-3{width:500px;height:500px;background:radial-gradient(circle,rgba(244,63,94,.05) 0%,transparent 70%);top:45%;left:48%;transform:translate(-50%,-50%);animation:drift3 32s ease-in-out infinite}
    @keyframes drift1{0%,100%{transform:translate(0,0)}40%{transform:translate(50px,35px)}75%{transform:translate(-25px,55px)}}
    @keyframes drift2{0%,100%{transform:translate(0,0)}35%{transform:translate(-45px,-50px)}70%{transform:translate(35px,-20px)}}
    @keyframes drift3{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.15)}}
    .grid-lines{position:absolute;inset:0;background-image:linear-gradient(rgba(0,201,167,.012) 1px,transparent 1px),linear-gradient(90deg,rgba(0,201,167,.012) 1px,transparent 1px);background-size:80px 80px}
    .scanlines{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(0,0,0,.02) 2px,rgba(0,0,0,.02) 4px)}

    /* ANIMATIONS */
    @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    @keyframes scaleIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
    @keyframes taskIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
    @keyframes checkPop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
    @keyframes pulseRing{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.75);opacity:0}}
    @keyframes confetti{0%{transform:translateY(-30px) rotate(0deg);opacity:1}100%{transform:translateY(105vh) rotate(360deg);opacity:0}}
    @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(0,201,167,.4)}50%{box-shadow:0 0 0 6px rgba(99,102,241,0)}}
    @keyframes barIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}

    /* TYPOGRAPHY */
    .font-display{font-family:'Syne',sans-serif}
    .font-mono{font-family:'JetBrains Mono',monospace}
    .section-label{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#48486a}

    /* CARDS */
    .day-card{position:relative;background:#12121e;border:1px solid rgba(255,255,255,.055);border-radius:18px;padding:16px;cursor:pointer;transition:transform .3s cubic-bezier(.16,1,.3,1),border-color .25s,box-shadow .3s;overflow:hidden;contain:layout style}
    .day-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);opacity:0;transition:opacity .3s}
    .day-card:hover{transform:translateY(-4px) scale(1.01);border-color:rgba(255,255,255,.1);box-shadow:0 8px 24px rgba(0,0,0,.4)}
    .day-card:hover::before{opacity:1}
    .day-card:active{transform:translateY(-1px) scale(.99)}
    .day-card.today{border-color:rgba(0,201,167,.4);box-shadow:0 0 0 1px rgba(0,201,167,.12),0 0 48px rgba(0,201,167,.08)}
    .day-card.today::after{content:'';position:absolute;inset:-2px;border-radius:20px;border:2px solid rgba(0,201,167,.3);animation:pulseRing 3s ease-out infinite;pointer-events:none;will-change:transform,opacity}
    .day-card.selected{border-color:rgba(0,201,167,.6);box-shadow:0 0 0 2px rgba(0,201,167,.18),0 16px 48px rgba(0,201,167,.12)}
    .day-card.glow-r{box-shadow:0 4px 24px rgba(239,68,68,.07)}
    .day-card.glow-y{box-shadow:0 4px 24px rgba(234,179,8,.07)}
    .day-card.glow-g{box-shadow:0 4px 24px rgba(34,197,94,.07)}
    .day-card.glow-r:hover{box-shadow:0 12px 40px rgba(239,68,68,.12)}
    .day-card.glow-y:hover{box-shadow:0 12px 40px rgba(234,179,8,.12)}
    .day-card.glow-g:hover{box-shadow:0 12px 40px rgba(34,197,94,.12)}

    /* RING */
    .ring-svg{transform:rotate(-90deg)}
    .ring-bg{stroke:rgba(255,255,255,.05)}
    .ring-fill{transition:stroke-dashoffset .7s cubic-bezier(.16,1,.3,1),stroke .4s}

    /* PROGRESS */
    .prog-track{height:5px;background:rgba(255,255,255,.05);border-radius:3px;overflow:hidden}
    .prog-fill{height:100%;border-radius:3px;transition:width .55s cubic-bezier(.16,1,.3,1);transform-origin:left}

    /* STAT CARDS */
    .stat-card{background:#12121e;border:1px solid rgba(255,255,255,.055);border-radius:18px;padding:22px;position:relative;overflow:hidden;transition:border-color .3s,transform .3s;contain:layout style}
    .stat-card:hover{border-color:rgba(255,255,255,.1);transform:translateY(-2px)}
    .stat-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px}
    .stat-card.sa::after{background:linear-gradient(90deg,#00c9a7,#4dd9c0)}
    .stat-card.st::after{background:linear-gradient(90deg,#d4a020,#c08b00)}
    .stat-card.sw::after{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
    .stat-card.se::after{background:linear-gradient(90deg,#10b981,#34d399)}
    .stat-card.sr::after{background:linear-gradient(90deg,#f43f5e,#fb7185)}

    /* TASK ITEMS */
    .task-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.045);border-radius:11px;transition:background .2s,border-color .2s,opacity .2s;animation:taskIn .22s cubic-bezier(.16,1,.3,1) both}
    .task-item:hover{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.08)}
    .task-item.done .task-lbl{text-decoration:line-through;color:#48486a}
    .task-item.done{opacity:.48}
    .task-cb{width:18px;height:18px;min-width:18px;border:2px solid rgba(255,255,255,.12);border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;margin-top:1px}
    .task-cb:hover{border-color:rgba(0,201,167,.5);background:rgba(0,201,167,.06)}
    .task-cb.checked{background:#00c9a7;border-color:#00c9a7;animation:checkPop .24s ease,glow .5s ease}
    .task-cb.checked::after{content:'\f00c';font-family:'Font Awesome 6 Free';font-weight:900;font-size:9px;color:#fff}
    .task-time{font-family:'JetBrains Mono',monospace;font-size:10px;color:#48486a;white-space:nowrap;flex-shrink:0;padding-top:1px}
    .task-del{opacity:0;min-width:26px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:7px;color:#5a5a78;cursor:pointer;transition:all .2s;margin-left:auto}
    .task-item:hover .task-del{opacity:1}
    .task-del:hover{background:rgba(244,63,94,.15);color:#f43f5e}

    /* INPUTS */
    .task-input{flex:1;padding:10px 14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:11px;color:#eeeef8;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;transition:all .25s;min-width:0}
    .task-input::placeholder{color:#48486a}
    .task-input:focus{border-color:rgba(0,201,167,.45);background:rgba(0,201,167,.04);box-shadow:0 0 0 3px rgba(0,201,167,.08)}

    /* BUTTONS */
    .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:11px;font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .22s;border:none}
    .btn-p{background:#00c9a7;color:#060c0b}
    .btn-p:hover{background:#00a98d;box-shadow:0 4px 20px rgba(0,201,167,.35);transform:translateY(-1px)}
    .btn-g{background:rgba(255,255,255,.04);color:#8080a0;border:1px solid rgba(255,255,255,.07)}
    .btn-g:hover{background:rgba(255,255,255,.08);color:#eeeef8;border-color:rgba(255,255,255,.12)}

    /* SUBJECT PANEL */
    .subj-panel{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:16px;overflow:hidden;transition:border-color .3s}
    .subj-panel:hover{border-color:rgba(255,255,255,.08)}
    .subj-header{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;transition:background .2s}
    .subj-header:hover{background:rgba(255,255,255,.02)}
    .subj-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s cubic-bezier(.16,1,.3,1)}
    .subj-panel.collapsed .subj-body{grid-template-rows:0fr}
    .subj-body-inner{overflow:hidden}
    .subj-chev{transition:transform .3s}
    .subj-panel.collapsed .subj-chev{transform:rotate(-90deg)}

    /* SIDE PANEL */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
    .overlay.open{opacity:1;pointer-events:auto}
    .side-panel{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:540px;background:#080810;border-left:1px solid rgba(255,255,255,.07);z-index:101;transform:translateX(105%);transition:transform .38s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;overflow:hidden}
    .side-panel.open{transform:translateX(0)}
    .sp-head{padding:20px 24px 18px;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0;background:#080810}
    .sp-body{flex:1;overflow-y:auto;padding:20px 24px}
    .sp-body::-webkit-scrollbar{width:5px}
    .sp-body::-webkit-scrollbar-track{background:transparent}
    .sp-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:3px}


    /* FILTER TABS */
    .ftabs{display:flex;gap:5px;padding:5px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:14px}
    .ftab{padding:7px 13px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;transition:all .22s;color:#8080a0;font-family:'DM Sans',sans-serif;white-space:nowrap}
    .ftab:hover{color:#eeeef8;background:rgba(255,255,255,.04)}
    .ftab.active{background:#00c9a7;color:#fff;box-shadow:0 4px 14px rgba(0,201,167,.3)}

    /* HEATMAP */
    .hm-cell{height:11px;border-radius:3px;transition:transform .18s,opacity .18s;cursor:pointer;flex:1}
    .hm-cell:hover{transform:scaleY(1.6);opacity:.9}

    /* WEEK HEADER */
    .week-hdr{display:flex;align-items:center;gap:14px;margin:16px 0 10px}
    .week-lbl{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:#48486a;letter-spacing:2px;text-transform:uppercase;white-space:nowrap}
    .week-line{flex:1;height:1px;background:rgba(255,255,255,.04)}

    /* MOOD */
    .mood-btn{font-size:20px;cursor:pointer;transition:transform .2s,filter .2s;filter:grayscale(1) opacity(.35);border-radius:8px;padding:4px 6px}
    .mood-btn:hover{transform:scale(1.2);filter:grayscale(0) opacity(.9)}
    .mood-btn.sel{filter:grayscale(0) opacity(1);transform:scale(1.15)}

    /* NOTES */
    .notes-ta{width:100%;resize:none;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:12px 14px;color:#eeeef8;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;transition:all .25s;min-height:80px;line-height:1.65}
    .notes-ta::placeholder{color:#48486a}
    .notes-ta:focus{border-color:rgba(0,201,167,.4);background:rgba(99,102,241,.03);box-shadow:0 0 0 3px rgba(0,201,167,.07)}

    /* HOURS */
    .hrs-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:9px;cursor:pointer;color:#8080a0;transition:all .2s}
    .hrs-btn:hover{background:rgba(255,255,255,.09);color:#eeeef8}

    /* TOAST */
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#181828;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px 22px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;z-index:2000;box-shadow:0 20px 60px rgba(0,0,0,.6);transition:transform .35s cubic-bezier(.16,1,.3,1),opacity .25s;opacity:0;pointer-events:none}
    .toast.show{transform:translateX(-50%) translateY(0);opacity:1}

    /* SUBJECT TAG */
    .stag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:500}

    /* EMPTY */
    .empty{display:flex;flex-direction:column;align-items:center;padding:24px 16px;color:#48486a;text-align:center;gap:8px}

    /* KEYBOARD MODAL */
    kbd{background:#0d1a18;border:1px solid rgba(0,201,167,.2);padding:3px 8px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#00c9a7}


    /* ── NOISE TEXTURE ── */
    .bg-canvas::after{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");opacity:.4;pointer-events:none;mix-blend-mode:overlay}

    /* ── GRADIENT BORDER TRICK (key cards) ── */
    .gcard{position:relative;border-radius:20px}
    .gcard::before{content:'';position:absolute;inset:-1px;border-radius:21px;background:linear-gradient(135deg,rgba(0,201,167,.3) 0%,transparent 40%,rgba(212,160,32,.15) 100%);z-index:0;pointer-events:none}
    .gcard > *{position:relative;z-index:1}

    /* ── ORBS: slightly richer ── */
    .orb-1{background:radial-gradient(circle,rgba(0,201,167,.13) 0%,transparent 65%) !important}
    .orb-2{background:radial-gradient(circle,rgba(212,160,32,.09) 0%,transparent 65%) !important}

    /* ── SECTION LABEL: turquoise tint ── */
    .section-label{color:rgba(0,201,167,.45) !important;letter-spacing:2.5px !important}

    /* ── STAT CARDS: glass + glow on hover ── */
    .stat-card{background:rgba(14,14,26,.9) !important;}
    .stat-card::before{content:'';position:absolute;inset:0;border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,.04) 0%,transparent 60%);pointer-events:none}
    .stat-card.sa:hover{box-shadow:0 8px 32px rgba(0,201,167,.12),0 0 0 1px rgba(0,201,167,.25) !important}
    .stat-card.st:hover{box-shadow:0 8px 32px rgba(212,160,32,.1),0 0 0 1px rgba(212,160,32,.2) !important}
    .stat-card.sw:hover{box-shadow:0 8px 32px rgba(245,158,11,.1),0 0 0 1px rgba(245,158,11,.2) !important}
    .stat-card.se:hover{box-shadow:0 8px 32px rgba(16,185,129,.1),0 0 0 1px rgba(16,185,129,.2) !important}

    /* ── DAY CARDS: glass surface ── */
    .day-card{background:rgba(14,14,26,.85) !important;}
    .day-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);opacity:1 !important}

    /* ── PROGRESS CARD: inner shine ── */
    #subjBreakCard::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(160deg,rgba(0,201,167,.04) 0%,transparent 50%);border-radius:20px;pointer-events:none}

    /* ── GRID LINES: dot pattern overlay ── */
    .grid-lines{background-image:radial-gradient(rgba(0,201,167,.06) 1px, transparent 1px) !important;background-size:32px 32px !important}

    /* ── COUNTDOWN CHIPS: premium glass ── */
    .cd-chip{background:rgba(0,201,167,.06) !important;border:1px solid rgba(0,201,167,.2) !important;box-shadow:0 0 16px rgba(0,201,167,.06),inset 0 1px 0 rgba(255,255,255,.06) !important;border-radius:10px !important}
    .cd-chip .cd-num{color:#00c9a7 !important;text-shadow:0 0 20px rgba(0,201,167,.4)}

    /* ── WEEK HEADER LINE: gradient ── */
    .week-line{background:linear-gradient(90deg,rgba(0,201,167,.15),rgba(212,160,32,.08),transparent) !important}
    .week-lbl{color:rgba(0,201,167,.4) !important}

    /* ── SIDE PANEL: glass ── */
    .side-panel{background:rgba(8,8,16,.95) !important;}

    /* ── BTNS: glass secondary ── */
    .btn-g{background:rgba(255,255,255,.04) !important;border:1px solid rgba(255,255,255,.09) !important;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
    .btn-g:hover{background:rgba(255,255,255,.09) !important;border-color:rgba(0,201,167,.2) !important}
    .btn-p{box-shadow:0 4px 20px rgba(0,201,167,.25),inset 0 1px 0 rgba(255,255,255,.15) !important}

    /* ── FILTER TABS ── */
    .ftab.active{box-shadow:0 4px 16px rgba(0,201,167,.25),inset 0 1px 0 rgba(255,255,255,.15) !important}

    /* ── LOGO ICON: subtle pulse ── */
    @keyframes logoPulse{0%,100%{box-shadow:0 0 0 0 rgba(0,201,167,.3)}70%{box-shadow:0 0 0 8px rgba(0,201,167,0)}}
    .logo-icon{animation:logoPulse 3s ease-in-out infinite}

    /* ── OVERALL PROGRESS HEADER TOP BAR ── */
    .prog-topbar{background:linear-gradient(90deg,#00c9a7,rgba(212,160,32,.8),rgba(0,201,167,.4)) !important;opacity:.7 !important}

    /* ── TOAST: glass ── */
    .toast{background:rgba(18,18,30,.95) !important;border-color:rgba(0,201,167,.15) !important}


    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       OBSIDIAN TERMINAL — Complete Premium Redesign
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

    /* FOUNDATION */
    body { background: #03030a !important; }

    /* Performance: Respect reduced motion preference */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .orb, .grid-lines, .scanlines { display: none !important; }
    }

    /* Performance: Disable complex effects on low-power devices */
    @media (prefers-reduced-motion: reduce) or (hover: none) {
      .bg-canvas::after { display: none !important; }
    }

    /* BACKGROUND — richer depth */
    .orb-1 {
      width: 1100px !important; height: 1100px !important;
      background: radial-gradient(circle, rgba(0,201,167,.11) 0%, transparent 62%) !important;
      filter: blur(60px) !important; top: -300px !important; left: -250px !important;
      will-change: transform;
    }
    .orb-2 {
      width: 800px !important; height: 800px !important;
      background: radial-gradient(circle, rgba(212,160,32,.08) 0%, transparent 62%) !important;
      filter: blur(50px) !important;
      will-change: transform;
    }
    .orb-3 {
      background: radial-gradient(circle, rgba(0,201,167,.03) 0%, transparent 70%) !important;
      filter: blur(80px) !important;

// ═══════════════════════════════════════
//  CONSTANTS

];
const MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const DAYS   = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const START  = new Date(2026,4,5);
const EXAM   = new Date(2026,5,20);
const SKEY   = 'yks_planner_v5';
const RING_C = 2*Math.PI*18;
const QUOTES = [
  {t:'Başarı, her gün tekrarlanan küçük çabaların toplamıdır.',    a:''},
  {t:'Yorulduğunda dur, ama asla vazgeçme.',                        a:''},
  {t:'Bugün ekilmeyen tohum, yarın meyve vermez.',                  a:'Türk Atasözü'},
  {t:'Odaklanmış bir saat, dağınık üç saate bedeldir.',             a:''},
  {t:'Çalışmak kaderin önüne geçer.',                               a:'Türk Atasözü'},
  {t:'Hedefin seni çekiyor, motivasyon sadece iter.',               a:''},
  {t:'Her büyük başarı, bir zamanlar imkânsız görünüyordu.',        a:''},
  {t:'Sınav seni değil, sen sınavı seçiyorsun.',                   a:''},
  {t:'Düşmanın senden akıllı olabilir, ama sen ondan çok çalışabilirsin.', a:''},
  {t:'Bugünkü ter, yarınki zafer.',                                 a:''},
];
const MOODS = ['😴','😐','🙂','😊','🔥'];

// ═══════════════════════════════════════
//  STATE
// ═══════════════════════════════════════
let appData = {days:[]};
let selDay = null, savedScrollY = 0, saveTimer = null, activeFilter = 'all';
let cardRefs = new Map(), spRefs = null, sEl = {};
let audioCtx = null, qIdx = 0, qInterval = null, cdInterval = null;
let notesTimer = null;

// ═══════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════
function dateOf(n){const d=new Date(START);d.setDate(d.getDate()+(n-1));return d}
function fmtFull(d){return`${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}, ${DAYS[d.getDay()]}`}
function fmtShort(d){return`${d.getDate()} ${MONTHS[d.getMonth()]}`}
function isToday(d){const n=new Date();return d.getDate()===n.getDate()&&d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()}
function esc(t){const div=document.createElement('div');div.textContent=t;return div.innerHTML}
function fmtTime(ts){if(!ts)return'';const d=new Date(ts);return`${p2(d.getHours())}:${p2(d.getMinutes())}`}
function p2(n){return String(n).padStart(2,'0')}
function scheduleSave(){if(saveTimer)clearTimeout(saveTimer);saveTimer=setTimeout(()=>localStorage.setItem(SKEY,JSON.stringify(appData)),400)}
function getRingColor(p){if(p===0)return'#383858';if(p<=30)return'#ef4444';if(p<=70)return'#eab308';return'#22c55e'}
function getHeatColor(p){if(p===0)return'rgba(255,255,255,.04)';if(p<=30)return'rgba(239,68,68,.38)';if(p<=70)return'rgba(234,179,8,.45)';return'rgba(34,197,94,.52)'}

function ensAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
function playTick(){try{ensAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='sine';o.frequency.setValueAtTime(880,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(1760,audioCtx.currentTime+.06);g.gain.setValueAtTime(.05,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.12);o.start();o.stop(audioCtx.currentTime+.12)}catch(e){}}
function playWin(){try{ensAudio();[523.25,659.25,783.99,1046.5].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='sine';o.frequency.value=f;const t=audioCtx.currentTime+i*.1;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.06,t+.05);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3)})}catch(e){}}

function initData(){
  const saved=localStorage.getItem(SKEY);
  if(saved){try{
    appData=JSON.parse(saved);
    if(!appData.days||appData.days.length!==45)throw 0;
    appData.days.forEach(d=>{
      SUBJECTS.forEach(s=>{if(!d.subjects[s.key])d.subjects[s.key]=[]});
      if(!d.notes)d.notes='';
      if(typeof d.studyHours!=='number')d.studyHours=0;
      if(typeof d.mood!=='number')d.mood=-1;
    });
    return;
  }catch(e){}}
  appData={days:[]};
  for(let i=1;i<=45;i++){
    const day={day:i,subjects:{},notes:'',studyHours:0,mood:-1};
    SUBJECTS.forEach(s=>{day.subjects[s.key]=[]});
    appData.days.push(day);
  }
  scheduleSave();
}

function dayStats(d){let total=0,done=0;for(const s of SUBJECTS){const t=d.subjects[s.key]||[];total+=t.length;for(const x of t)if(x.done)done++}return{total,done,percent:total>0?Math.round((done/total)*100):0}}
function overallStats(){let tt=0,td=0,th=0;for(const d of appData.days){const s=dayStats(d);tt+=s.total;td+=s.done;th+=d.studyHours||0}return{tt,td,th,avg:tt>0?Math.round((td/tt)*100):0}}
function subjStats(){return SUBJECTS.map(s=>{let total=0,done=0;for(const d of appData.days){const t=d.subjects[s.key]||[];total+=t.length;for(const x of t)if(x.done)done++}return{...s,total,done,pct:total>0?Math.round((done/total)*100):0}})}
function streak(){let s=0;const today=new Date();today.setHours(0,0,0,0);for(let i=44;i>=0;i--){const date=dateOf(i+1);if(date>today)continue;const st=dayStats(appData.days[i]);if(st.total>0&&st.percent>=70)s++;else if(st.total>0)break}return s}

  const d=Math.floor(diff/86400000),h=Math.floor((diff%86400000)/3600000),m=Math.floor((diff%3600000)/60000),s=Math.floor((diff%60000)/1000);
  const u=(v,l,hi)=>`<div style="display:flex;flex-direction:column;align-items:center;padding:7px 14px;border-radius:12px;background:${hi?'rgba(0,201,167,.07)':'rgba(255,255,255,.03)'};border:1px solid ${hi?'rgba(0,201,167,.25)':'rgba(255,255,255,.06)'};${hi?'box-shadow:0 0 20px rgba(0,201,167,.08)':''}"><span class="font-mono font-bold" style="font-size:1.35rem;line-height:1;color:${hi?'#00c9a7':'#c0c0d8'};letter-spacing:-0.5px">${p2(v)}</span><span style="font-size:8px;text-transform:uppercase;letter-spacing:2px;color:${hi?'rgba(0,201,167,.5)':'#48486a'};margin-top:3px">${l}</span></div>`;

function updateCard(n){
  const ref=cardRefs.get(n);if(!ref)return;
  const dd=appData.days[n-1],st=dayStats(dd),color=getRingColor(st.percent),glow=getGlow(st.percent),offset=RING_C-(st.percent/100)*RING_C;
  ref.el.classList.remove('glow-r','glow-y','glow-g');if(glow)ref.el.classList.add(glow);
  ref.el.classList.toggle('selected',selDay===n);
  ref.ring.setAttribute('stroke-dashoffset',offset.toFixed(1));ref.ring.setAttribute('stroke',color);
  ref.pct.textContent=st.percent+'%';ref.pct.style.color=color;
  ref.done.textContent=`${st.done}/${st.total} görev`;
  if(dd.studyHours>0){ref.hrs.textContent=`⏱ ${dd.studyHours}s`;ref.hrs.style.display=''}else ref.hrs.style.display='none';
  if(dd.mood>=0){ref.mood.textContent=MOODS[dd.mood];ref.mood.style.display=''}else ref.mood.style.display='none';
  const active=SUBJECTS.filter(s=>(dd.subjects[s.key]||[]).length>0);
  ref.tags.innerHTML=active.length>0?`<div style="display:flex;flex-wrap:wrap;gap:4px">${active.map(s=>`<span class="stag" style="background:${s.color}12;color:${s.color}"><i class="fa-solid ${s.icon}" style="font-size:8px"></i>${s.name}</span>`).join('')}</div>`:'<span style="font-size:11px;color:#48486a;font-style:italic">Henüz görev eklenmedi</span>';
  applyFilterCard(ref.el,st);
}
function updateAllCards(){for(let i=1;i<=45;i++)updateCard(i)}

function checkFilter(st){if(activeFilter==='all')return true;if(activeFilter==='empty')return st.total===0;if(activeFilter==='inprogress')return st.total>0&&st.percent<100;if(activeFilter==='done')return st.percent===100&&st.total>0;return true}

function applyFilter(){
  let vis=0;

            <button class="btn btn-p flex-shrink-0 px-3 py-2" data-subject="${subj.key}" data-action="add"><i class="fa-solid fa-plus text-xs"></i></button>
          </div>
          <div class="sj-tasks" style="display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto;padding-right:2px"></div>
        </div>
      </div></div>`;
    frag.appendChild(panel);
    const taskList=panel.querySelector('.sj-tasks');
    renderTasks(taskList,tasks,subj.key);
    spRefs.subjects.set(subj.key,{panel,taskList,bar:panel.querySelector('.sj-bar'),pctEl:panel.querySelector('.sj-pct'),doneEl:panel.querySelector('.sj-done'),input:panel.querySelector('.task-input')});
  }
  container.innerHTML='';container.appendChild(frag);
}

function renderTasks(container,tasks,subjKey){
  if(tasks.length===0){container.innerHTML=`<div class="empty"><i class="fa-regular fa-clipboard" style="font-size:24px;opacity:.2"></i><span class="text-sm">Henüz görev yok</span></div>`;return}
  const frag=document.createDocumentFragment();
  tasks.forEach((t,i)=>{
    const item=document.createElement('div');item.className=`task-item${t.done?' done':''}`;item.dataset.index=i;
    item.innerHTML=`
      <div class="task-cb${t.done?' checked':''}" data-action="toggle" data-index="${i}"></div>
      <span class="task-lbl text-sm flex-1" style="color:#eeeef8;min-width:0;word-break:break-word;line-height:1.45">${esc(t.text)}</span>
      ${t.done&&t.completedAt?`<span class="task-time">${fmtTime(t.completedAt)}</span>`:''}
      <div class="task-del" data-action="delete" data-index="${i}"><i class="fa-solid fa-xmark text-xs"></i></div>`;
    frag.appendChild(item);
  });
  container.innerHTML='';container.appendChild(frag);
}

// Panel body event delegation
document.getElementById('spBody').addEventListener('click',e=>{
  if(!spRefs)return;
  // Subject header toggle
  const sh=e.target.closest('.subj-header');
  if(sh){const p=sh.closest('.subj-panel');if(p){const c=p.classList.contains('collapsed');spRefs.subjects.forEach(r=>r.panel.classList.add('collapsed'));if(c)p.classList.remove('collapsed')}return}
  // Add task button
  const ab=e.target.closest('[data-action="add"]');
  if(ab){const ref=spRefs.subjects.get(ab.dataset.subject);if(ref)addTask(ab.dataset.subject,ref.input);return}
  // Checkbox
  const cb=e.target.closest('.task-cb');
  if(cb&&cb.dataset.index!==undefined){const p=cb.closest('.subj-panel');if(p)toggleTask(p.dataset.subject,parseInt(cb.dataset.index));return}
  // Delete
  const db=e.target.closest('.task-del');
  if(db&&db.dataset.index!==undefined){const p=db.closest('.subj-panel');if(p)deleteTask(p.dataset.subject,parseInt(db.dataset.index));return}
});
document.getElementById('spBody').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.classList.contains('task-input')){
    const ref=spRefs&&spRefs.subjects.get(e.target.dataset.subject);if(ref)addTask(e.target.dataset.subject,ref.input);
  }
});

// ═══════════════════════════════════════
//  TASK OPS
// ═══════════════════════════════════════
function addTask(subj,inputEl){
  const text=inputEl.value.trim();if(!text||!selDay)return;
  appData.days[selDay-1].subjects[subj].push({text,done:false,completedAt:null});
  inputEl.value='';scheduleSave();refreshPanel();
}
function toggleTask(subj,idx){
  if(!selDay)return;
  const dd=appData.days[selDay-1],task=dd.subjects[subj][idx],wasDone=task.done;
  task.done=!wasDone;task.completedAt=task.done?Date.now():null;
  if(!wasDone)playTick();
  scheduleSave();
  const st=dayStats(dd);
  if(!wasDone&&st.percent===100&&st.total>0){setTimeout(triggerConfetti,100);playWin();showToast('Mükemmel! Tüm görevler tamamlandı! 🎉','fa-trophy','#f59e0b')}
  refreshPanel();
}
function deleteTask(subj,idx){
  if(!selDay)return;
  appData.days[selDay-1].subjects[subj].splice(idx,1);scheduleSave();refreshPanel();
}
function refreshPanel(){
  if(!selDay||!spRefs)return;
  const dd=appData.days[selDay-1],st=dayStats(dd),color=getRingColor(st.percent);
  document.getElementById('spSub').textContent=`${selDay}. Gün · ${st.done}/${st.total} görev tamamlandı`;
  document.getElementById('spPct').textContent=st.percent+'%';document.getElementById('spPct').style.color=color;
  document.getElementById('spNum').style.color=color;document.getElementById('spBadge').style.background=color+'15';
  document.getElementById('spBar').style.width=st.percent+'%';document.getElementById('spBar').style.background=color;
  for(const subj of SUBJECTS){
    const ref=spRefs.subjects.get(subj.key);if(!ref)continue;
    const tasks=dd.subjects[subj.key]||[],doneC=tasks.filter(t=>t.done).length,pct=tasks.length>0?Math.round((doneC/tasks.length)*100):0;
    ref.doneEl.textContent=`${doneC}/${tasks.length} tamamlandı`;ref.pctEl.textContent=pct+'%';ref.bar.style.width=pct+'%';
    const items=ref.taskList.querySelectorAll('.task-item');
    if(items.length!==tasks.length){renderTasks(ref.taskList,tasks,subj.key)}
    else items.forEach((item,j)=>{
      const t=tasks[j],cb=item.querySelector('.task-cb'),te=item.querySelector('.task-time');
      item.classList.toggle('done',t.done);cb.classList.toggle('checked',t.done);
      if(t.done&&t.completedAt&&!te){const s=document.createElement('span');s.className='task-time';s.textContent=fmtTime(t.completedAt);item.insertBefore(s,item.querySelector('.task-del'))}
      else if(!t.done&&te)te.remove();
    });
  }
  updateCard(selDay);updateStats();
}

// ═══════════════════════════════════════
//  MOOD / HOURS / NOTES
// ═══════════════════════════════════════
function setMood(idx){if(!selDay)return;appData.days[selDay-1].mood=idx;scheduleSave();document.querySelectorAll('.mood-btn').forEach((b,i)=>b.classList.toggle('sel',i===idx));updateCard(selDay)}
function chgHrs(delta){if(!selDay)return;const d=appData.days[selDay-1];d.studyHours=Math.max(0,Math.min(24,Math.round(((d.studyHours||0)+delta)*2)/2));const el=document.getElementById('hrsDisp');if(el)el.textContent=d.studyHours;scheduleSave();updateCard(selDay);updateStats()}
function saveNotes(v){if(!selDay)return;const t=v.slice(0,500);appData.days[selDay-1].notes=t;const el=document.getElementById('notesChars');if(el)el.textContent=`${t.length} / 500`;if(notesTimer)clearTimeout(notesTimer);notesTimer=setTimeout(scheduleSave,500)}


// ═══════════════════════════════════════
//  CONFETTI
// ═══════════════════════════════════════
function triggerConfetti(){
  const colors=['#00c9a7','#d4a020','#10b981','#f59e0b','#f43f5e','#a855f7','#fbbf24','#38bdf8'];
  for(let i=0;i<40;i++){
    const p=document.createElement('div'),c=colors[i%colors.length],x=Math.random()*100,sz=Math.random()*10+5,dur=Math.random()*2.5+1.8,del=Math.random()*.7,circ=Math.random()>.4;
    p.style.cssText=`position:fixed;left:${x}vw;top:-30px;width:${sz}px;height:${sz}px;background:${c};border-radius:${circ?'50%':'3px'};z-index:9999;pointer-events:none;animation:confetti ${dur}s ${del}s ease-in forwards;transform:rotate(${Math.random()*360}deg)`;
    document.body.appendChild(p);setTimeout(()=>p.remove(),(dur+del)*1000+200);
  }
}

// ═══════════════════════════════════════
//  EXPORT / IMPORT
// ═══════════════════════════════════════
function exportData(){
  const blob=new Blob([JSON.stringify(appData,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=`yks_planner_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  showToast('Veriler dışa aktarıldı','fa-download','#00c9a7');
}
function importData(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{try{
    const data=JSON.parse(e.target.result);
    if(!data.days||data.days.length!==45)throw 0;
    appData=data;
    SUBJECTS.forEach(s=>appData.days.forEach(d=>{
      if(!d.subjects[s.key])d.subjects[s.key]=[];
      if(!d.notes)d.notes='';if(typeof d.studyHours!=='number')d.studyHours=0;if(typeof d.mood!=='number')d.mood=-1;
    }));
    scheduleSave();updateAllCards();updateStats();
    if(selDay){const dd=appData.days[selDay-1];buildSubjList(dd);updateSpHead(selDay,dd)}
    showToast('Veriler içe aktarıldı','fa-upload','#10b981');
  }catch(e){showToast('Geçersiz dosya formatı','fa-triangle-exclamation','#ef4444')}};
  reader.readAsText(file);event.target.value='';
}

// ═══════════════════════════════════════
//  TOAST + SHORTCUTS
// ═══════════════════════════════════════
let tTimer=null;
function showToast(msg,icon,color){
  const t=document.getElementById('toast'),ic=document.getElementById('tIcon'),mg=document.getElementById('tMsg');
  ic.className=`fa-solid ${icon}`;ic.style.color=color;mg.textContent=msg;t.classList.add('show');
  if(tTimer)clearTimeout(tTimer);tTimer=setTimeout(()=>t.classList.remove('show'),3200);
}
function showShortcuts(){const m=document.getElementById('kbModal');m.style.opacity='1';m.style.pointerEvents='auto'}
function hideShortcuts(){const m=document.getElementById('kbModal');m.style.opacity='0';m.style.pointerEvents='none'}

// ═══════════════════════════════════════
//  KEYBOARD
// ═══════════════════════════════════════
document.addEventListener('keydown',e=>{
  if(document.getElementById('kbModal').style.opacity==='1'){if(e.key==='Escape')hideShortcuts();return}
  if(e.key==='Escape'&&selDay){closeSidePanel();return}
  if(e.key==='ArrowLeft'&&selDay&&!e.target.matches('input,textarea')){navDay(-1);return}
  if(e.key==='ArrowRight'&&selDay&&!e.target.matches('input,textarea')){navDay(1);return}
});

// ═══════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════
document.addEventListener('DOMContentLoaded',()=>{
  initData();
  renderStats();
  buildGrid();
  updateAllCards();
  applyFilter();
  initQuotes();
  updateCountdown();
  cdInterval=setInterval(updateCountdown,1000);
  let vis=0;for(let i=1;i<=45;i++){const r=cardRefs.get(i);if(r&&r.el.style.display!=='none')vis++}
  document.getElementById('visCount').textContent=`(${vis} gün)`;
});
</script>
