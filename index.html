<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YKS 45 Gün Çalışma Planlayıcı</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style type="text/tailwindcss">
    @theme {
      --font-sans: 'Outfit', sans-serif;
      --font-mono: 'Space Mono', monospace;
      --color-void: #0a0a0f;
      --color-abyss: #0f0f17;
      --color-deep: #13131f;
      --color-surface: #1a1a28;
      --color-surface-raised: #202030;
      --color-surface-hover: #262638;
      --color-border: rgba(255,255,255,0.05);
      --color-text-primary: #e8e8f0;
      --color-text-secondary: #8a8aa0;
      --color-text-muted: #5a5a70;
      --color-accent: #6366f1;
      --color-accent-dim: rgba(99,102,241,0.12);
      --color-green: #22c55e;
      --color-green-dim: rgba(34,197,94,0.12);
      --color-yellow: #eab308;
      --color-yellow-dim: rgba(234,179,8,0.12);
      --color-red: #ef4444;
      --color-red-dim: rgba(239,68,68,0.12);
      --color-rose: #f43f5e;
      --color-cyan: #06b6d4;
      --color-amber: #f59e0b;
      --color-emerald: #10b981;
    }
  </style>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Outfit', sans-serif;
      background: #0a0a0f;
      color: #e8e8f0;
      overflow-x: hidden;
      min-height: 100vh;
    }

    .ambient-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .ambient-orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.08; animation: orbFloat 20s ease-in-out infinite; }
    .ambient-orb:nth-child(1) { width: 600px; height: 600px; background: #6366f1; top: -10%; left: -5%; }
    .ambient-orb:nth-child(2) { width: 500px; height: 500px; background: #06b6d4; bottom: -15%; right: -10%; animation-delay: -7s; animation-duration: 25s; }
    .ambient-orb:nth-child(3) { width: 400px; height: 400px; background: #f43f5e; top: 40%; left: 50%; animation-delay: -14s; animation-duration: 22s; }
    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(30px, -40px) scale(1.05); }
      50% { transform: translate(-20px, 20px) scale(0.95); }
      75% { transform: translate(40px, 10px) scale(1.02); }
    }

    .noise-overlay { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.025; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); background-repeat: repeat; background-size: 256px; }
    .grid-pattern { position: fixed; inset: 0; z-index: 0; pointer-events: none; background-image: linear-gradient(rgba(99,102,241,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(99,102,241,0.03) 1px, transparent 1px); background-size: 60px 60px; mask-image: radial-gradient(ellipse at center, black 0%, transparent 70%); -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 70%); }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    @keyframes pulse-ring { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(1.6); opacity: 0; } }
    @keyframes checkPop { 0% { transform: scale(1); } 40% { transform: scale(1.2); } 100% { transform: scale(1); } }
    @keyframes taskSlide { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes barGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes checkGlow { 0% { box-shadow: 0 0 0 0 rgba(99,102,241,0.5); } 50% { box-shadow: 0 0 0 6px rgba(99,102,241,0); } 100% { box-shadow: 0 0 0 0 rgba(99,102,241,0); } }

    .anim-fade-up { animation: fadeUp 0.4s cubic-bezier(0.16,1,0.3,1) forwards; opacity: 0; }
    .anim-scale-in { animation: scaleIn 0.35s cubic-bezier(0.16,1,0.3,1) forwards; opacity: 0; }

    .day-card {
      position: relative;
      background: #1a1a28;
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.16,1,0.3,1), border-color 0.3s ease, box-shadow 0.3s ease;
      will-change: transform;
    }
    .day-card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.1); box-shadow: 0 12px 40px rgba(0,0,0,0.4); }
    .day-card:active { transform: translateY(-1px) scale(0.98); }
    .day-card.today { border-color: rgba(99,102,241,0.4); box-shadow: 0 0 0 1px rgba(99,102,241,0.15), 0 0 40px rgba(99,102,241,0.08); }
    .day-card.today::after { content: ''; position: absolute; inset: -2px; border-radius: 18px; border: 2px solid rgba(99,102,241,0.3); animation: pulse-ring 2.5s ease-out infinite; pointer-events: none; }
    .day-card.selected { border-color: rgba(99,102,241,0.6); box-shadow: 0 0 0 2px rgba(99,102,241,0.2), 0 12px 40px rgba(99,102,241,0.1); }

    .day-card.glow-red { box-shadow: 0 0 20px rgba(239,68,68,0.08), 0 4px 12px rgba(0,0,0,0.3); }
    .day-card.glow-yellow { box-shadow: 0 0 20px rgba(234,179,8,0.08), 0 4px 12px rgba(0,0,0,0.3); }
    .day-card.glow-green { box-shadow: 0 0 20px rgba(34,197,94,0.08), 0 4px 12px rgba(0,0,0,0.3); }
    .day-card.glow-red:hover { box-shadow: 0 0 30px rgba(239,68,68,0.12), 0 8px 24px rgba(0,0,0,0.4); }
    .day-card.glow-yellow:hover { box-shadow: 0 0 30px rgba(234,179,8,0.12), 0 8px 24px rgba(0,0,0,0.4); }
    .day-card.glow-green:hover { box-shadow: 0 0 30px rgba(34,197,94,0.12), 0 8px 24px rgba(0,0,0,0.4); }

    .progress-ring { transform: rotate(-90deg); }
    .progress-ring-bg { stroke: rgba(255,255,255,0.06); }
    .progress-ring-fill { transition: stroke-dashoffset 0.6s cubic-bezier(0.16,1,0.3,1), stroke 0.4s ease; }

    .task-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 10px;
      transition: background 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
    }
    .task-item:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.08); }
    .task-item.done .task-text { text-decoration: line-through; color: #5a5a70; }
    .task-item.done { opacity: 0.55; }

    .task-checkbox {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 5px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .task-checkbox:hover { border-color: rgba(99,102,241,0.5); }
    .task-checkbox.checked {
      background: #6366f1; border-color: #6366f1;
      animation: checkPop 0.25s ease, checkGlow 0.4s ease;
      box-shadow: 0 0 10px rgba(99,102,241,0.3);
    }
    .task-checkbox.checked::after { content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900; font-size: 9px; color: white; }

    .task-delete {
      opacity: 0; width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 7px; color: #5a5a70; cursor: pointer;
      transition: all 0.2s ease; margin-left: auto; flex-shrink: 0;
    }
    .task-item:hover .task-delete { opacity: 1; }
    .task-delete:hover { background: rgba(244,63,94,0.15); color: #f43f5e; }

    .task-input {
      width: 100%; padding: 10px 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px; color: #e8e8f0;
      font-size: 13px; font-family: 'Outfit', sans-serif;
      outline: none; transition: all 0.25s ease;
    }
    .task-input::placeholder { color: #5a5a70; }
    .task-input:focus { border-color: rgba(99,102,241,0.4); background: rgba(99,102,241,0.04); box-shadow: 0 0 0 3px rgba(99,102,241,0.08); }

    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 18px; border-radius: 11px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: all 0.25s ease; border: none;
      font-family: 'Outfit', sans-serif;
    }
    .btn-primary { background: #6366f1; color: white; }
    .btn-primary:hover { background: #5558e0; box-shadow: 0 4px 20px rgba(99,102,241,0.3); transform: translateY(-1px); }
    .btn-ghost { background: rgba(255,255,255,0.04); color: #8a8aa0; border: 1px solid rgba(255,255,255,0.06); }
    .btn-ghost:hover { background: rgba(255,255,255,0.08); color: #e8e8f0; border-color: rgba(255,255,255,0.1); }

    .stat-card {
      background: #1a1a28; border: 1px solid rgba(255,255,255,0.05);
      border-radius: 16px; padding: 18px;
      position: relative; overflow: hidden;
      transition: border-color 0.3s ease, transform 0.3s ease;
    }
    .stat-card:hover { border-color: rgba(255,255,255,0.1); transform: translateY(-2px); }
    .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; opacity: 0.6; }
    .stat-card.accent::before { background: #6366f1; }
    .stat-card.yellow::before { background: #eab308; }
    .stat-card.rose::before { background: #f43f5e; }

    .subject-panel {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 16px; overflow: hidden;
      transition: border-color 0.3s ease;
    }
    .subject-panel:hover { border-color: rgba(255,255,255,0.08); }
    .subject-header {
      padding: 14px 18px;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s ease;
    }
    .subject-header:hover { background: rgba(255,255,255,0.02); }

    .subject-body {
      display: grid;
      grid-template-rows: 1fr;
      transition: grid-template-rows 0.35s cubic-bezier(0.16,1,0.3,1);
    }
    .subject-panel.collapsed .subject-body {
      grid-template-rows: 0fr;
    }
    .subject-body-inner {
      overflow: hidden;
    }
    .subject-chevron {
      transition: transform 0.3s ease;
    }
    .subject-panel.collapsed .subject-chevron {
      transform: rotate(-90deg);
    }

    .progress-track { height: 5px; background: rgba(255,255,255,0.05); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s cubic-bezier(0.16,1,0.3,1), background-color 0.3s ease; transform-origin: left; }

    .side-panel-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
      z-index: 100; opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .side-panel-overlay.active { opacity: 1; pointer-events: auto; }

    .side-panel {
      position: fixed; top: 0; right: 0; bottom: 0;
      width: 100%; max-width: 520px;
      background: #0f0f17;
      border-left: 1px solid rgba(255,255,255,0.06);
      z-index: 101;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.16,1,0.3,1);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .side-panel.active { transform: translateX(0); }
    .side-panel-header { padding: 20px 24px; border-bottom: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; background: #0f0f17; }
    .side-panel-body { flex: 1; overflow-y: auto; padding: 20px 24px; }
    .side-panel-body::-webkit-scrollbar { width: 5px; }
    .side-panel-body::-webkit-scrollbar-track { background: transparent; }
    .side-panel-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #202030; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; padding: 14px 24px;
      display: flex; align-items: center; gap: 10px;
      font-size: 14px; font-weight: 500; color: #e8e8f0;
      z-index: 1000; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      transition: transform 0.35s cubic-bezier(0.16,1,0.3,1), opacity 0.25s ease;
      opacity: 0; pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    .day-number { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 10px; letter-spacing: 0.5px; text-transform: uppercase; }
    .percent-text { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 12px; }

    .subject-tag {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 6px;
      font-size: 10px; font-weight: 500;
    }

    .empty-state { text-align: center; padding: 32px 16px; color: #5a5a70; }
    .empty-state i { font-size: 28px; margin-bottom: 10px; opacity: 0.4; }

    #fileInput { display: none; }

    @media (max-width: 640px) {
      .side-panel { max-width: 100%; }
      .day-card { padding: 12px; border-radius: 14px; }
      .stat-card { padding: 14px; }
    }
  </style>
</head>
<body class="min-h-screen">
  <div class="ambient-bg"><div class="ambient-orb"></div><div class="ambient-orb"></div><div class="ambient-orb"></div></div>
  <div class="noise-overlay"></div>
  <div class="grid-pattern"></div>

  <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-10">
    <header class="mb-8 sm:mb-10 anim-fade-up">
      <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4">
        <div>
          <div class="flex items-center gap-3 mb-2">
            <div class="w-10 h-10 rounded-xl bg-accent/10 flex items-center justify-center">
              <i class="fa-solid fa-graduation-cap text-accent text-lg"></i>
            </div>
            <div>
              <p class="text-text-muted text-xs font-mono tracking-wider uppercase">YKS Hazırlık</p>
              <h1 class="text-2xl sm:text-3xl font-bold text-text-primary tracking-tight">YKS ÇALIŞMA PANOSU</h1>
            </div>
          </div>
          <p class="text-text-secondary text-sm mt-1 ml-[52px] flex items-center gap-2 flex-wrap">
            <span id="countdownBadge" class="text-accent text-xs font-medium bg-accent-dim px-2.5 py-0.5 rounded-full"></span>
          </p>
        </div>
        <div class="flex items-center gap-2 ml-[52px] sm:ml-0">
          <button onclick="exportData()" class="btn btn-ghost text-xs">
            <i class="fa-solid fa-download"></i>
            <span class="hidden sm:inline">Verileri İndir</span>
            <span class="sm:hidden">İndir</span>
          </button>
          <button onclick="document.getElementById('fileInput').click()" class="btn btn-ghost text-xs">
            <i class="fa-solid fa-upload"></i>
            <span class="hidden sm:inline">Veri Yükle</span>
            <span class="sm:hidden">Yükle</span>
          </button>
          <input type="file" id="fileInput" accept=".json" onchange="importData(event)">
        </div>
      </div>
    </header>

    <section id="statsSection" class="mb-8 sm:mb-10 anim-fade-up" style="animation-delay:0.05s">
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-4 max-w-2xl mx-auto" id="statsGrid"></div>
    </section>

    <section class="mb-8 sm:mb-10 anim-fade-up" style="animation-delay:0.1s">
      <div class="bg-surface border border-border rounded-2xl p-5 sm:p-6 relative overflow-hidden">
        <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-accent via-cyan to-accent opacity-60"></div>
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-accent-dim flex items-center justify-center">
              <i class="fa-solid fa-chart-line text-accent text-sm"></i>
            </div>
            <div>
              <h3 class="text-text-primary font-semibold text-sm">Genel İlerleme</h3>
              <p class="text-text-muted text-xs">Tüm günlerin ortalama tamamlanma oranı</p>
            </div>
          </div>
          <span id="overallPercent" class="percent-text text-accent text-lg">0%</span>
        </div>
        <div class="progress-track">
          <div id="overallBar" class="progress-fill bg-gradient-to-r from-accent to-cyan" style="width:0%"></div>
        </div>
        <div class="flex justify-between mt-3 text-xs text-text-muted">
          <span id="totalCompleted">0 tamamlanan görev</span>
          <span id="totalTasks">0 toplam görev</span>
        </div>
      </div>
    </section>

    <section class="mb-10 anim-fade-up" style="animation-delay:0.15s">
      <div class="flex items-center justify-between mb-5">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-accent-dim flex items-center justify-center">
            <i class="fa-solid fa-calendar-days text-accent text-sm"></i>
          </div>
          <h2 class="text-text-primary font-semibold text-base">Günler</h2>
        </div>
        <div class="flex items-center gap-3 text-xs text-text-muted">
          <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-red"></span> Düşük</span>
          <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-yellow"></span> Orta</span>
          <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-green"></span> İyi</span>
        </div>
      </div>
      <div id="dayGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-4"></div>
    </section>
  </div>

  <div id="sidePanelOverlay" class="side-panel-overlay" onclick="closeSidePanel()"></div>
  <div id="sidePanel" class="side-panel">
    <div class="side-panel-header">
      <div class="flex items-center justify-between mb-4">
        <button onclick="closeSidePanel()" class="btn btn-ghost text-xs">
          <i class="fa-solid fa-arrow-left"></i> Kapat
        </button>
      </div>
      <div class="flex items-center gap-4">
        <div id="spDayBadge" class="w-12 h-12 rounded-2xl bg-accent-dim flex items-center justify-center flex-shrink-0">
          <span id="spDayNum" class="text-accent font-bold text-lg font-mono">1</span>
        </div>
        <div class="min-w-0">
          <h2 id="spDateTitle" class="text-lg sm:text-xl font-bold text-text-primary truncate">5 Mayıs 2026</h2>
          <p id="spDaySubtitle" class="text-text-secondary text-sm">1. Gün · 5/10 görev tamamlandı</p>
        </div>
      </div>
      <div class="mt-4 flex items-center gap-4">
        <div class="flex-1"><div class="progress-track"><div id="spBar" class="progress-fill bg-accent" style="width:0%"></div></div></div>
        <span id="spPercent" class="percent-text text-accent text-sm font-bold">50%</span>
      </div>
    </div>
    <div class="side-panel-body" id="spSubjects"></div>
  </div>

  <div id="toast" class="toast">
    <i id="toastIcon" class="fa-solid fa-check-circle toast-icon text-green"></i>
    <span id="toastMessage">İşlem başarılı</span>
  </div>

  <script>
    // ===================== CONSTANTS =====================
    const SUBJECTS = [
      { key: 'matematik', name: 'Matematik', icon: 'fa-square-root-variable', color: '#6366f1' },
      { key: 'fizik', name: 'Fizik', icon: 'fa-atom', color: '#06b6d4' },
      { key: 'kimya', name: 'Kimya', icon: 'fa-flask', color: '#f59e0b' },
      { key: 'biyoloji', name: 'Biyoloji', icon: 'fa-dna', color: '#10b981' },
      { key: 'geometri', name: 'Geometri', icon: 'fa-shapes', color: '#f43f5e' }
    ];
    const MONTHS_TR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
    const DAYS_TR = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
    const START_DATE = new Date(2026, 4, 5);
    const EXAM_DATE = new Date(2026, 5, 20);
    const STORAGE_KEY = 'yks_planner_v3';
    const RING_CIRCUMFERENCE = 2 * Math.PI * 18;

    // ===================== STATE =====================
    let appData = { days: [] };
    let selectedDay = null;
    let savedScrollY = 0;
    let saveTimeout = null;
    let dayCardRefs = new Map();
    let panelRefs = null;
    let audioCtx = null;
    let statRefs = {};

    // ===================== DATE HELPERS =====================
    function getDateForDay(dayNum) {
      const d = new Date(START_DATE);
      d.setDate(d.getDate() + (dayNum - 1));
      return d;
    }
    function formatDateFull(date) {
      return `${date.getDate()} ${MONTHS_TR[date.getMonth()]} ${date.getFullYear()}, ${DAYS_TR[date.getDay()]}`;
    }
    function formatDateShort(date) {
      return `${date.getDate()} ${MONTHS_TR[date.getMonth()]}`;
    }
    function isToday(date) {
      const now = new Date();
      return date.getDate() === now.getDate() && date.getMonth() === now.getMonth() && date.getFullYear() === now.getFullYear();
    }
    function updateCountdown() {
      const now = new Date();
      now.setHours(0,0,0,0);
      const exam = new Date(EXAM_DATE);
      exam.setHours(0,0,0,0);
      const diff = Math.ceil((exam - now) / 86400000);
      const el = document.getElementById('countdownBadge');
      if (!el) return;
      if (diff > 0) el.textContent = `Sınava ${diff} gün kaldı`;
      else if (diff === 0) el.textContent = 'Bugün sınav!';
      else el.textContent = `Sınav ${Math.abs(diff)} gün önceydi`;
    }

    // ===================== AUDIO =====================
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function playTickSound() {
      if (!audioCtx) initAudio();
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.1);
    }

    // ===================== DATA =====================
    function initData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          appData = JSON.parse(saved);
          if (!appData.days || appData.days.length !== 45) throw new Error('Invalid');
          appData.days.forEach(d => {
            SUBJECTS.forEach(s => { if (!d.subjects[s.key]) d.subjects[s.key] = []; });
          });
          return;
        } catch (e) { console.warn('Corrupted data, resetting'); }
      }
      appData = { days: [] };
      for (let i = 1; i <= 45; i++) {
        const day = { day: i, subjects: {} };
        SUBJECTS.forEach(s => { day.subjects[s.key] = []; });
        appData.days.push(day);
      }
      scheduleSave();
    }

    function scheduleSave() {
      if (saveTimeout) clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        saveTimeout = null;
      }, 400);
    }

    // ===================== STATS =====================
    function getDayStats(dayData) {
      let total = 0, done = 0;
      for (let i = 0; i < SUBJECTS.length; i++) {
        const tasks = dayData.subjects[SUBJECTS[i].key];
        total += tasks.length;
        for (let j = 0; j < tasks.length; j++) if (tasks[j].done) done++;
      }
      return { total, done, percent: total > 0 ? Math.round((done / total) * 100) : 0 };
    }

    function getOverallStats() {
      let totalTasks = 0, totalDone = 0;
      for (let i = 0; i < appData.days.length; i++) {
        const s = getDayStats(appData.days[i]);
        totalTasks += s.total;
        totalDone += s.done;
      }
      const avgPercent = totalTasks > 0 ? Math.round((totalDone / totalTasks) * 100) : 0;
      return { totalTasks, totalDone, avgPercent };
    }

    function getStreak() {
      let streak = 0;
      for (let i = appData.days.length - 1; i >= 0; i--) {
        const s = getDayStats(appData.days[i]);
        if (s.percent >= 70) streak++;
        else if (s.total > 0) break;
      }
      return streak;
    }

    // ===================== RENDER: STATS =====================
    function renderStats() {
      const stats = getOverallStats();
      const streak = getStreak();
      const cards = [
        { key: 'tasks', label: 'Görevler', value: `${stats.totalDone} / ${stats.totalTasks}`, icon: 'fa-list-check', color: 'accent', code: '#6366f1' },
        { key: 'avg', label: 'Ortalama', value: stats.avgPercent + '%', icon: 'fa-percent', color: 'yellow', code: '#eab308' },
        { key: 'streak', label: 'Seri', value: streak + ' gün', icon: 'fa-fire', color: 'rose', code: '#f43f5e' },
      ];
      document.getElementById('statsGrid').innerHTML = cards.map(c => `
        <div class="stat-card ${c.color}" data-stat="${c.key}">
          <div class="flex items-center gap-2 mb-3">
            <div class="w-7 h-7 rounded-lg flex items-center justify-center" style="background:${c.code}15">
              <i class="fa-solid ${c.icon}" style="color:${c.code};font-size:12px"></i>
            </div>
            <span class="text-text-muted text-xs font-medium">${c.label}</span>
          </div>
          <div class="stat-value text-text-primary text-xl sm:text-2xl font-bold font-mono">${c.value}</div>
        </div>
      `).join('');

      statRefs.tasks = document.querySelector('[data-stat="tasks"] .stat-value');
      statRefs.avg = document.querySelector('[data-stat="avg"] .stat-value');
      statRefs.streak = document.querySelector('[data-stat="streak"] .stat-value');

      document.getElementById('overallPercent').textContent = stats.avgPercent + '%';
      document.getElementById('overallBar').style.width = stats.avgPercent + '%';
      document.getElementById('totalCompleted').textContent = stats.totalDone + ' tamamlanan görev';
      document.getElementById('totalTasks').textContent = stats.totalTasks + ' toplam görev';
    }

    function updateStats() {
      const stats = getOverallStats();
      const streak = getStreak();
      if (statRefs.tasks) statRefs.tasks.textContent = `${stats.totalDone} / ${stats.totalTasks}`;
      if (statRefs.avg) statRefs.avg.textContent = stats.avgPercent + '%';
      if (statRefs.streak) statRefs.streak.textContent = streak + ' gün';
      document.getElementById('overallPercent').textContent = stats.avgPercent + '%';
      document.getElementById('overallBar').style.width = stats.avgPercent + '%';
      document.getElementById('totalCompleted').textContent = stats.totalDone + ' tamamlanan görev';
      document.getElementById('totalTasks').textContent = stats.totalTasks + ' toplam görev';
    }

    // ===================== COLOR HELPERS =====================
    function getCardColorClass(percent) {
      if (percent === 0) return '';
      if (percent <= 30) return 'red';
      if (percent <= 70) return 'yellow';
      return 'green';
    }
    function getGlowClass(percent) {
      if (percent <= 30) return 'glow-red';
      if (percent <= 70) return 'glow-yellow';
      return 'glow-green';
    }
    function getRingColor(percent) {
      if (percent === 0) return '#3a3a50';
      if (percent <= 30) return '#ef4444';
      if (percent <= 70) return '#eab308';
      return '#22c55e';
    }

    // ===================== RENDER: GRID =====================
    function buildGrid() {
      const grid = document.getElementById('dayGrid');
      const frag = document.createDocumentFragment();

      for (let idx = 0; idx < appData.days.length; idx++) {
        const day = appData.days[idx];
        const date = getDateForDay(day.day);
        const dateStr = formatDateShort(date);
        const dayName = DAYS_TR[date.getDay()];
        const todayFlag = isToday(date);

        const el = document.createElement('div');
        el.className = `day-card ${todayFlag ? 'today' : ''}`;
        el.dataset.day = day.day;
        el.style.opacity = '0';
        el.style.animation = `fadeUp 0.4s cubic-bezier(0.16,1,0.3,1) ${idx * 0.008}s forwards`;

        el.innerHTML = `
          <div class="flex items-start justify-between mb-2">
            <div>
              <div class="text-text-primary font-semibold text-sm">${dateStr}</div>
              <div class="text-text-muted text-[11px]">${dayName} · ${day.day}. Gün</div>
            </div>
            <div class="flex flex-col items-end gap-1">
              ${todayFlag ? '<span class="text-[10px] font-semibold text-accent bg-accent-dim px-2 py-0.5 rounded-full">BUGÜN</span>' : ''}
              <div class="relative w-10 h-10 flex-shrink-0">
                <svg class="progress-ring w-10 h-10" viewBox="0 0 40 40">
                  <circle class="progress-ring-bg" cx="20" cy="20" r="18" fill="none" stroke-width="2.5"/>
                  <circle class="progress-ring-fill" cx="20" cy="20" r="18" fill="none" stroke-width="2.5"
                    stroke-linecap="round" stroke-dasharray="${RING_CIRCUMFERENCE.toFixed(1)}"
                    stroke-dashoffset="${RING_CIRCUMFERENCE.toFixed(1)}" stroke="#3a3a50"/>
                </svg>
                <span class="day-ring-text absolute inset-0 flex items-center justify-center text-[9px] font-bold font-mono text-text-secondary">0%</span>
              </div>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <span class="day-done-text text-text-secondary text-xs font-medium">0/0 tamamlandı</span>
          </div>
          <div class="day-tags mt-3 pt-3 border-t border-white/5"></div>
        `;

        frag.appendChild(el);

        dayCardRefs.set(day.day, {
          el,
          ring: el.querySelector('.progress-ring-fill'),
          percentText: el.querySelector('.day-ring-text'),
          doneText: el.querySelector('.day-done-text'),
          tagsContainer: el.querySelector('.day-tags'),
        });
      }

      grid.appendChild(frag);

      grid.addEventListener('click', (e) => {
        const card = e.target.closest('.day-card');
        if (card) openDay(parseInt(card.dataset.day));
      });
    }

    function updateDayCard(dayNum) {
      const ref = dayCardRefs.get(dayNum);
      if (!ref) return;
      const dayData = appData.days[dayNum - 1];
      const stats = getDayStats(dayData);
      const colorClass = getCardColorClass(stats.percent);
      const glowClass = getGlowClass(stats.percent);
      const ringColor = getRingColor(stats.percent);
      const offset = RING_CIRCUMFERENCE - (stats.percent / 100) * RING_CIRCUMFERENCE;

      ref.el.classList.remove('red', 'yellow', 'green', 'glow-red', 'glow-yellow', 'glow-green');
      if (colorClass) ref.el.classList.add(colorClass);
      ref.el.classList.add(glowClass);

      if (selectedDay === dayNum) ref.el.classList.add('selected');
      else ref.el.classList.remove('selected');

      ref.ring.setAttribute('stroke-dashoffset', offset.toFixed(1));
      ref.ring.setAttribute('stroke', ringColor);
      ref.percentText.textContent = stats.percent + '%';
      ref.doneText.textContent = `${stats.done}/${stats.total} tamamlandı`;

      const activeSubjects = SUBJECTS.filter(s => (dayData.subjects[s.key] || []).length > 0);
      if (activeSubjects.length > 0) {
        ref.tagsContainer.innerHTML = activeSubjects.map(s =>
          `<span class="subject-tag" style="background:${s.color}12;color:${s.color}">
            <i class="fa-solid ${s.icon}" style="font-size:8px"></i>${s.name}
          </span>`
        ).join('');
      } else {
        ref.tagsContainer.innerHTML = '<span class="text-text-muted text-[11px] italic">Henüz görev eklenmedi</span>';
      }
    }

    function updateAllDayCards() {
      for (let i = 1; i <= 45; i++) updateDayCard(i);
    }

    // ===================== SIDE PANEL =====================
    function openDay(dayNum) {
      if (selectedDay === dayNum) return;
      selectedDay = dayNum;
      savedScrollY = window.scrollY;

      const dayData = appData.days[dayNum - 1];
      const stats = getDayStats(dayData);
      const date = getDateForDay(dayNum);
      const ringColor = getRingColor(stats.percent);

      document.getElementById('spDayNum').textContent = dayNum;
      document.getElementById('spDateTitle').textContent = formatDateFull(date);
      document.getElementById('spDaySubtitle').textContent = `${dayNum}. Gün · ${stats.done}/${stats.total} görev tamamlandı`;
      document.getElementById('spPercent').textContent = stats.percent + '%';
      document.getElementById('spDayNum').style.color = ringColor;
      document.getElementById('spPercent').style.color = ringColor;
      document.getElementById('spDayBadge').style.background = ringColor + '15';

      const bar = document.getElementById('spBar');
      bar.style.width = stats.percent + '%';
      bar.style.background = ringColor;

      buildPanelSubjects(dayData);

      document.getElementById('sidePanelOverlay').classList.add('active');
      document.getElementById('sidePanel').classList.add('active');
      document.body.style.overflow = 'hidden';

      updateAllDayCards();
    }

    function closeSidePanel() {
      document.getElementById('sidePanelOverlay').classList.remove('active');
      document.getElementById('sidePanel').classList.remove('active');
      document.body.style.overflow = '';
      const prev = selectedDay;
      selectedDay = null;
      panelRefs = null;
      if (prev) {
        const ref = dayCardRefs.get(prev);
        if (ref) ref.el.classList.remove('selected');
      }
      window.scrollTo({ top: savedScrollY, behavior: 'instant' });
    }

    function buildPanelSubjects(dayData) {
      const container = document.getElementById('spSubjects');
      panelRefs = { subjects: new Map() };
      const frag = document.createDocumentFragment();

      for (let i = 0; i < SUBJECTS.length; i++) {
        const subj = SUBJECTS[i];
        const tasks = dayData.subjects[subj.key] || [];
        const doneCount = tasks.filter(t => t.done).length;
        const totalCount = tasks.length;
        const pct = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;

        const panel = document.createElement('div');
        panel.className = 'subject-panel mb-4 collapsed';
        panel.dataset.subject = subj.key;
        panel.innerHTML = `
          <div class="subject-header" data-action="toggle-subject">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:${subj.color}12">
                <i class="fa-solid ${subj.icon}" style="color:${subj.color};font-size:13px"></i>
              </div>
              <div>
                <h3 class="text-text-primary font-semibold text-sm">${subj.name}</h3>
                <p class="subject-done-text text-text-muted text-xs">${doneCount}/${totalCount} tamamlandı</p>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <span class="subject-percent percent-text text-sm font-bold" style="color:${subj.color}">${pct}%</span>
              <i class="fa-solid fa-chevron-down subject-chevron text-text-muted text-xs"></i>
            </div>
          </div>
          <div class="subject-body">
            <div class="subject-body-inner">
              <div class="px-4 pb-1 pt-2">
                <div class="progress-track">
                  <div class="subject-bar progress-fill" style="width:${pct}%;background:${subj.color}"></div>
                </div>
              </div>
              <div class="p-4 pt-3">
                <div class="flex gap-2 mb-3">
                  <input type="text" class="task-input" placeholder="Yeni görev ekle..." data-subject="${subj.key}">
                  <button class="btn btn-primary flex-shrink-0 px-3" data-subject="${subj.key}">
                    <i class="fa-solid fa-plus text-xs"></i>
                  </button>
                </div>
                <div class="subject-tasks flex flex-col gap-1.5 max-h-[240px] overflow-y-auto pr-1"></div>
              </div>
            </div>
          </div>
        `;

        frag.appendChild(panel);

        const taskList = panel.querySelector('.subject-tasks');
        renderTaskList(taskList, tasks, subj.key);

        panelRefs.subjects.set(subj.key, {
          panel,
          taskList,
          progressBar: panel.querySelector('.subject-bar'),
          percentText: panel.querySelector('.subject-percent'),
          doneText: panel.querySelector('.subject-done-text'),
          input: panel.querySelector('.task-input'),
        });
      }

      container.innerHTML = '';
      container.appendChild(frag);
    }

    function renderTaskList(container, tasks, subjectKey) {
      if (tasks.length === 0) {
        container.innerHTML = `
          <div class="empty-state py-6">
            <i class="fa-regular fa-clipboard text-text-muted" style="font-size:28px;opacity:0.4"></i>
            <p class="text-sm text-text-muted">Henüz görev eklenmemiş</p>
          </div>`;
        return;
      }
      const frag = document.createDocumentFragment();
      for (let i = 0; i < tasks.length; i++) {
        const t = tasks[i];
        const item = document.createElement('div');
        item.className = `task-item ${t.done ? 'done' : ''}`;
        item.dataset.index = i;
        item.innerHTML = `
          <div class="task-checkbox ${t.done ? 'checked' : ''}" data-action="toggle" data-index="${i}"></div>
          <span class="task-text text-sm text-text-primary flex-1 min-w-0 truncate">${escapeHtml(t.text)}</span>
          <div class="task-delete" data-action="delete" data-index="${i}">
            <i class="fa-solid fa-xmark text-xs"></i>
          </div>
        `;
        frag.appendChild(item);
      }
      container.innerHTML = '';
      container.appendChild(frag);
    }

    // Event delegation for side panel
    document.getElementById('spSubjects').addEventListener('click', (e) => {
      const target = e.target.closest('[data-action]');
      if (target && target.dataset.action === 'toggle-subject') {
        const panel = target.closest('.subject-panel');
        const wasCollapsed = panel.classList.contains('collapsed');
        // Close all
        panelRefs.subjects.forEach(ref => ref.panel.classList.add('collapsed'));
        // Open clicked if it was collapsed
        if (wasCollapsed) panel.classList.remove('collapsed');
        return;
      }
      if (!target) {
        const btn = e.target.closest('.btn-primary');
        if (btn && btn.dataset.subject) {
          const ref = panelRefs.subjects.get(btn.dataset.subject);
          if (ref) addTask(btn.dataset.subject, ref.input);
        }
        return;
      }
      const action = target.dataset.action;
      const index = parseInt(target.dataset.index);
      const subjectKey = target.closest('.subject-panel').dataset.subject;
      if (action === 'toggle') toggleTask(subjectKey, index);
      else if (action === 'delete') deleteTask(subjectKey, index);
    });

    document.getElementById('spSubjects').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.classList.contains('task-input')) {
        const subjectKey = e.target.dataset.subject;
        if (subjectKey) addTask(subjectKey, e.target);
      }
    });

    // ===================== TASK OPERATIONS =====================
    function addTask(subjectKey, inputEl) {
      const text = inputEl.value.trim();
      if (!text || !selectedDay) return;
      const dayData = appData.days[selectedDay - 1];
      dayData.subjects[subjectKey].push({ text, done: false });
      inputEl.value = '';
      scheduleSave();
      refreshAfterChange();
    }

    function toggleTask(subjectKey, taskIdx) {
      if (!selectedDay) return;
      const dayData = appData.days[selectedDay - 1];
      const wasDone = dayData.subjects[subjectKey][taskIdx].done;
      dayData.subjects[subjectKey][taskIdx].done = !wasDone;
      if (!wasDone) playTickSound();
      scheduleSave();
      refreshAfterChange();
    }

    function deleteTask(subjectKey, taskIdx) {
      if (!selectedDay) return;
      const dayData = appData.days[selectedDay - 1];
      dayData.subjects[subjectKey].splice(taskIdx, 1);
      scheduleSave();
      refreshAfterChange();
    }

    function refreshAfterChange() {
      if (!selectedDay) return;
      const dayData = appData.days[selectedDay - 1];
      const stats = getDayStats(dayData);
      const ringColor = getRingColor(stats.percent);

      document.getElementById('spDaySubtitle').textContent = `${selectedDay}. Gün · ${stats.done}/${stats.total} görev tamamlandı`;
      document.getElementById('spPercent').textContent = stats.percent + '%';
      document.getElementById('spPercent').style.color = ringColor;
      document.getElementById('spDayNum').style.color = ringColor;
      document.getElementById('spDayBadge').style.background = ringColor + '15';
      const bar = document.getElementById('spBar');
      bar.style.width = stats.percent + '%';
      bar.style.background = ringColor;

      for (let i = 0; i < SUBJECTS.length; i++) {
        const subj = SUBJECTS[i];
        const ref = panelRefs.subjects.get(subj.key);
        if (!ref) continue;
        const tasks = dayData.subjects[subj.key] || [];
        const doneCount = tasks.filter(t => t.done).length;
        const totalCount = tasks.length;
        const pct = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;

        ref.doneText.textContent = `${doneCount}/${totalCount} tamamlandı`;
        ref.percentText.textContent = pct + '%';
        ref.progressBar.style.width = pct + '%';

        const currentItems = ref.taskList.querySelectorAll('.task-item');
        if (currentItems.length !== tasks.length) {
          renderTaskList(ref.taskList, tasks, subj.key);
        } else {
          for (let j = 0; j < currentItems.length; j++) {
            const item = currentItems[j];
            const cb = item.querySelector('.task-checkbox');
            if (tasks[j].done) {
              item.classList.add('done');
              cb.classList.add('checked');
            } else {
              item.classList.remove('done');
              cb.classList.remove('checked');
            }
          }
        }
      }

      updateDayCard(selectedDay);
      updateStats();
    }

    // ===================== EXPORT / IMPORT =====================
    function exportData() {
      const dataStr = JSON.stringify(appData, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `yks_planner_${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Veriler indirildi', 'fa-download', '#6366f1');
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (!data.days || data.days.length !== 45) throw new Error('Invalid');
          appData = data;
          SUBJECTS.forEach(s => {
            appData.days.forEach(d => { if (!d.subjects[s.key]) d.subjects[s.key] = []; });
          });
          scheduleSave();
          updateAllDayCards();
          updateStats();
          if (selectedDay) {
            const dayData = appData.days[selectedDay - 1];
            buildPanelSubjects(dayData);
            const stats = getDayStats(dayData);
            const ringColor = getRingColor(stats.percent);
            document.getElementById('spDaySubtitle').textContent = `${selectedDay}. Gün · ${stats.done}/${stats.total} görev tamamlandı`;
            document.getElementById('spPercent').textContent = stats.percent + '%';
            document.getElementById('spPercent').style.color = ringColor;
            document.getElementById('spDayNum').style.color = ringColor;
            document.getElementById('spBar').style.width = stats.percent + '%';
            document.getElementById('spBar').style.background = ringColor;
          }
          showToast('Veriler yüklendi', 'fa-upload', '#22c55e');
        } catch (err) {
          showToast('Geçersiz dosya formatı', 'fa-triangle-exclamation', '#ef4444');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // ===================== UTILS =====================
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    let toastTimeout = null;
    function showToast(msg, icon, color) {
      const toast = document.getElementById('toast');
      const toastIcon = document.getElementById('toastIcon');
      const toastMsg = document.getElementById('toastMessage');
      toastIcon.className = `fa-solid ${icon} toast-icon`;
      toastIcon.style.color = color;
      toastMsg.textContent = msg;
      toast.classList.add('show');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && selectedDay) closeSidePanel();
    });

    // ===================== BOOT =====================
    document.addEventListener('DOMContentLoaded', () => {
      initData();
      updateCountdown();
      renderStats();
      buildGrid();
      updateAllDayCards();
    });
  </script>
</body>
</html>
